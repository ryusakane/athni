<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AthNi</title>
    <noscript><meta http-equiv="refresh" content="0; url=/en" /></noscript>
    <script>
      // The language picked with the header switch wins; otherwise the browser's language.
      var lang;
      try { lang = localStorage.getItem("athni-lang"); } catch (e) {}
      if (lang !== "ja" && lang !== "en")
        lang = (navigator.language || "").toLowerCase().indexOf("ja") === 0 ? "ja" : "en";
      location.replace("/" + lang);
    </script>
  </head>
  <body>
    <p><a href="/en">English</a> / <a href="/ja">日本語</a></p>
  </body>
</html>
